<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Moribito</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body { width: 360px; padding: 14px; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      h1 { font-size: 14px; margin: 0; }
      .host { font-size: 15px; font-weight: 700; margin: 10px 0 2px; }
      .host-sub { font-size: 12px; color: var(--warn); margin-bottom: 2px; }
      .host-sub[hidden] { display: none; }
      .score-line { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; }
      .meter { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
      .meter > i { display: block; height: 100%; background: var(--ok); }
      #signals { max-height: 240px; overflow: auto; }
      .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .empty { color: var(--muted); font-size: 13px; }
      .check-form { display: flex; gap: 6px; margin-top: 12px; }
      .check-form input { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 8px;
        border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
    </style>
  </head>
  <body>
    <header>
      <h1>Moribito</h1>
      <label class="switch"><input type="checkbox" id="enabled" /> 有効</label>
    </header>

    <div class="host mono" id="host">—</div>
    <div class="host-sub mono" id="host-sub" hidden></div>
    <div class="score-line">
      <span class="badge allow" id="verdict">判定中</span>
      <span class="meter"><i id="meter-fill" style="width:0%"></i></span>
      <span class="mono" id="score">0</span>
    </div>

    <div class="card" id="signals"><span class="empty">危険な特徴は見つかりませんでした。</span></div>

    <div class="row-actions">
      <button id="allow-domain">このドメインを許可</button>
      <button id="options">設定</button>
    </div>

    <form class="check-form" id="check-form">
      <input type="text" id="check-url" placeholder="URLを貼り付けて判定" />
      <button class="primary" type="submit">判定</button>
    </form>
    <script type="module" src="popup.js"></script>
  </body>
</html>
